name: Update moli

on:
  schedule:
    # Every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update formula
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-moli.sh

      - name: Verify formula
        if: steps.update.outputs.version != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/hoishing"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/hoishing/homebrew-moli"
          brew style hoishing/moli/moli
          brew install hoishing/moli/moli
          brew test hoishing/moli/moli

      - name: Commit and push
        if: steps.update.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "moli ${{ steps.update.outputs.version }}"
          git push
